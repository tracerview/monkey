name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Check Deploy Dependencies
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "ERROR: Missing Dependency, wrangler.toml not found."
            echo "Generate wrangler.toml by following the documented [pre-deploy activity](https://github.com/tracerview/composite-domain-part/blob/main/docs/lifecycle.md#52-pre-deploy-dev-machine) to configure cloudflare worker for this composite domain part"
            exit 1
          fi

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
